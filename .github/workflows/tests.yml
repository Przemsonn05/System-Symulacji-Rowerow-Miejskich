name: Testy

# Tylko przy zmianach kodu - commity danych (co godzine) nie uruchamiaja testow.
on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "requirements*.txt"
      - "pytest.ini"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "requirements*.txt"
      - "pytest.ini"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # dane nie sa potrzebne do testow - plytki checkout jest szybszy
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-simulation.txt

      - name: Zaleznosci
        run: pip install -r requirements-simulation.txt geopandas

      - name: pytest
        run: python -m pytest -q
