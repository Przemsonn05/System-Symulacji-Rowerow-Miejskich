name: Zbieranie danych Veturilo

on:
  schedule:
    - cron: "3 * * * *"   # zabezpieczenie: wznawia lancuch, gdyby sie przerwal
  workflow_dispatch:       # reczne uruchomienie z zakladki Actions
    inputs:
      iterations:
        description: "Liczba pomiarow (1 = szybki test, 0 = pelna godzina + kolejne uruchomienia)"
        default: "1"

permissions:
  contents: write
  actions: write   # potrzebne, zeby run mogl uruchomic kolejny run

concurrency:
  group: collect-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zbieranie danych
        id: collect
        env:
          ITERATIONS: ${{ github.event.inputs.iterations || '1' }}
          DURATION_MIN: ${{ (github.event_name == 'schedule' || github.event.inputs.iterations == '0') && '57' || '0' }}
          INTERVAL_SEC: "300"
          # Opcjonalne - bez tych secrets dane o ruchu sa po prostu pomijane.
          WARSAW_API_KEY: ${{ secrets.WARSAW_API_KEY }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          # TomTom co 6. pomiar = co 30 min (~528 zapytan/dzien), zeby darmowy
          # limit wystarczyl na caly okres zbierania.
          TOMTOM_EVERY: "6"
        run: python collect.py

      - name: Zapis danych do repozytorium
        if: ${{ !cancelled() }}
        run: |
          if [ ! -d data ]; then
            echo "Brak folderu data - nic do zapisania (sprawdz log kroku 'Zbieranie danych')"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Brak nowych danych"
            exit 0
          fi
          git commit -m "Dane $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase && git push && break
            sleep 10
          done

      # Harmonogram GitHuba bywa pomijany, wiec kazdy pelny run sam uruchamia nastepny.
      # workflow_dispatch wywolany przez GITHUB_TOKEN tworzy nowy run (wyjatek w regulach GitHuba).
      - name: Uruchomienie kolejnego pomiaru
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event.inputs.iterations == '0') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ steps.collect.outcome }}" != "success" ]; then
            echo "Zbieranie nieudane - czekam 10 min przed kolejna proba"
            sleep 600
          fi
          gh workflow run collect.yml --ref "${{ github.ref_name }}" -f iterations=0
          echo "Uruchomiono kolejny run"
