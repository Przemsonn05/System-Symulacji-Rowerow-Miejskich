name: Zbieranie danych Veturilo

on:
  schedule:
    - cron: "3 * * * *"   # co godzine; kazde uruchomienie mierzy co 5 min przez 57 min
  workflow_dispatch:       # reczne uruchomienie z zakladki Actions
    inputs:
      iterations:
        description: "Liczba pomiarow (1 = szybki test, 0 = pelna godzina jak w harmonogramie)"
        default: "1"

permissions:
  contents: write

concurrency:
  group: collect-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zbieranie danych
        env:
          # Harmonogram (i reczne "0"): mierz przez 57 min. GitHub zwykle startuje
          # z opoznieniem ~10 min, wiec run konczy sie mniej wiecej wtedy, gdy
          # nastepny (czekajacy w kolejce dzieki concurrency) moze ruszyc - bez dziur.
          ITERATIONS: ${{ github.event.inputs.iterations || '1' }}
          DURATION_MIN: ${{ (github.event_name == 'schedule' || github.event.inputs.iterations == '0') && '57' || '0' }}
          INTERVAL_SEC: "300"
        run: python collect.py

      - name: Zapis danych do repozytorium
        if: always()
        run: |
          if [ ! -d data ]; then
            echo "Brak folderu data - nic do zapisania (sprawdz log kroku 'Zbieranie danych')"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Brak nowych danych"
            exit 0
          fi
          git commit -m "Dane $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase && git push && break
            sleep 10
          done